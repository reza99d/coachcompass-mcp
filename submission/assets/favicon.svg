<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded-square background in brand green (hsl(152 55% 40%)) -->
  <rect width="64" height="64" rx="14" fill="#2E9F6F"/>
  <!-- Outer compass ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
  <!-- Cardinal tick marks -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="31" y="8"  width="2" height="4"/>
    <rect x="31" y="52" width="2" height="4"/>
    <rect x="8"  y="31" width="4" height="2"/>
    <rect x="52" y="31" width="4" height="2"/>
  </g>
  <!-- N half of the needle: bright white -->
  <polygon points="32,12 38,32 26,32" fill="#ffffff"/>
  <!-- S half of the needle: muted -->
  <polygon points="32,52 38,32 26,32" fill="#ffffff" opacity="0.55"/>
  <!-- Center pivot -->
  <circle cx="32" cy="32" r="3" fill="#1a5c3f"/>
  <circle cx="32" cy="32" r="1.2" fill="#ffffff"/>
</svg>
