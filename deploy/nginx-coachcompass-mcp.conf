# CoachCompass MCP server (ChatGPT/Claude app) — included from /etc/nginx/sites-enabled/coachcompass (443 block).
# Managed by coachcompass-mcp/deploy/cc-mcp-deploy.sh. Exact-match locations win over the SPA and asset rules.

location = /mcp {
    proxy_pass http://127.0.0.1:8791/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;          # Streamable HTTP may answer as SSE
    proxy_cache off;
    gzip off;
    client_max_body_size 256k;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location = /legal/ai-app-privacy {
    default_type text/html;
    alias /opt/coachcompass-mcp/current/public/ai-app-privacy.html;
}

location = /legal/ai-app-terms {
    default_type text/html;
    alias /opt/coachcompass-mcp/current/public/ai-app-terms.html;
}

# OpenAI app domain verification (token file is placed by the operator from the OpenAI dashboard).
location = /.well-known/openai-apps-challenge {
    default_type text/plain;
    alias /opt/coachcompass-mcp/shared/openai-apps-challenge.txt;
}

# This MCP server needs no sign-in. Answer OAuth/OIDC discovery with a real 404 so MCP clients
# (Claude, ChatGPT) don't mistake the SPA's catch-all index.html (HTTP 200) for an authorization server.
location ^~ /.well-known/oauth-protected-resource {
    default_type application/json;
    return 404 '{"error":"not_found"}';
}
location ^~ /.well-known/oauth-authorization-server {
    default_type application/json;
    return 404 '{"error":"not_found"}';
}
location ^~ /.well-known/openid-configuration {
    default_type application/json;
    return 404 '{"error":"not_found"}';
}
